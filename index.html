<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador de Senhas</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<h1>🔐 Gerador de Senhas</h1>

<div class="senha-box">

<input
type="text"
id="senha"
readonly
placeholder="Clique em Gerar">

<button id="copiar">
📋
</button>

</div>

<button id="gerar" class="btn-gerar">
Gerar Senha
</button>

<div class="config">

<h2>Personalizar</h2>

<label>

Comprimento

<span id="valor">16</span>

</label>

<input
type="range"
id="tamanho"
min="6"
max="40"
value="16">

<label>
<input type="checkbox" id="maiusculas" checked>
Letras Maiúsculas
</label>

<label>
<input type="checkbox" id="minusculas" checked>
Letras Minúsculas
</label>

<label>
<input type="checkbox" id="numeros" checked>
Números
</label>

<label>
<input type="checkbox" id="simbolos" checked>
Símbolos
</label>

</div>

<div class="forca">

<div class="barra">

<div id="nivel"></div>

</div>

<p id="textoForca">Força: Média</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
