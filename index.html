<!DOCTYPE html>
<html lang="pt-BR">

<head>

        <meta charset="UTF-8">

            <meta name="viewport" content="width=device-width, initial-scale=1.0">

                <meta name="description"
                        content="Gerador de Senhas moderno, seguro e responsivo.">

                            <meta name="theme-color" content="#0f172a">

                                <title>Password Generator</title>

                                    <link rel="preconnect" href="https://fonts.googleapis.com">

                                        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

                                            <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
                                                    rel="stylesheet">

                                                        <link rel="stylesheet" href="style.css">

</head>

<body>

        <main class="container">

                    <section class="card">

                                    <header>

                                                        <h1>🔐 Password Generator</h1>

                                                                        <p>
                                                                                                Gere senhas fortes e criptograficamente seguras.
                                                                        </p>

                                                                    </header>

                                                                                <section class="password-area">

                                                                                                    <input
                                                                                                                        type="password"
                                                                                                                                            id="password"
                                                                                                                                                                readonly
                                                                                                                                                                                    autocomplete="off"
                                                                                                                                                                                                        spellcheck="false"
                                                                                                                                                                                                                            placeholder="Clique em Gerar">

                                                                                                                                                                                                                                            <button
                                                                                                                                                                                                                                                                id="showPassword"
                                                                                                                                                                                                                                                                                    class="icon-btn"
                                                                                                                                                                                                                                                                                                        title="Mostrar senha"
                                                                                                                                                                                                                                                                                                                            aria-label="Mostrar senha">

                                                                                                                                                                                                                                                                                                                                                👁️

                                                                                </button>

                                                                                                <button
                                                                                                                    id="copyPassword"
                                                                                                                                        class="icon-btn"
                                                                                                                                                            title="Copiar senha"
                                                                                                                                                                                aria-label="Copiar senha">

                                                                                                                                                                                                    📋

                                                                            </button>

                                                                        </section>

                                                                                    <button id="generatePassword" class="generate">

                                                                                                        Gerar Senha

                                                                                    </button>

                                                                                                <section class="options">

                                                                                                                    <h2>Configurações</h2>

                                                                                                                                    <div class="slider">

                                                                                                                                                            <label for="length">

                                                                                                                                                                                        Comprimento

                                                                                                                                                                                                                <span id="lengthValue">

                                                                                                                                                                                                                                                16

                                                                                                                                                                                                                </span>

                                                                                                                                                                                                            </label>

                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                        id="length"
                                                                                                                                                                                                                                                                                type="range"
                                                                                                                                                                                                                                                                                                        min="6"
                                                                                                                                                                                                                                                                                                                                max="64"
                                                                                                                                                                                                                                                                                                                                                        value="16">

                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                        <label class="checkbox">

                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                        id="uppercase"
                                                                                                                                                                                                                                                                                                type="checkbox"
                                                                                                                                                                                                                                                                                                                        checked>

                                                                                                                                                                                                                                                                                                                                            Letras Maiúsculas

                                                                                                                                                                                                                        </label>

                                                                                                                                                                                                                                        <label class="checkbox">

                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                        id="lowercase"
                                                                                                                                                                                                                                                                                                                type="checkbox"
                                                                                                                                                                                                                                                                                                                                        checked>

                                                                                                                                                                                                                                                                                                                                                            Letras Minúsculas

                                                                                                                                                                                                                                        </label>

                                                                                                                                                                                                                                                        <label class="checkbox">

                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                        id="numbers"
                                                                                                                                                                                                                                                                                                                                type="checkbox"
                                                                                                                                                                                                                                                                                                                                                        checked>

                                                                                                                                                                                                                                                                                                                                                                            Números

                                                                                                                                                                                                                                                        </label>

                                                                                                                                                                                                                                                                        <label class="checkbox">

                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                        id="symbols"
                                                                                                                                                                                                                                                                                                                                                type="checkbox"
                                                                                                                                                                                                                                                                                                                                                                        checked>

                                                                                                                                                                                                                                                                                                                                                                                            Símbolos

                                                                                                                                                                                                                                                                        </label>

                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                <section class="strength">

                                                                                                                                                                                                                                                                                                    <div class="strength-header">

                                                                                                                                                                                                                                                                                                                            <span>Força da senha</span>

                                                                                                                                                                                                                                                                                                                                                <span id="strengthText">

                                                                                                                                                                                                                                                                                                                                                                            Média

                                                                                                                                                                                                                                                                                                                                                </span>

                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                            <div class="strength-bar">

                                                                                                                                                                                                                                                                                                                                                                                    <div id="strengthLevel"></div>

                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                    <section class="tips">

                                                                                                                                                                                                                                                                                                                                                                                        <h3>Dicas</h3>

                                                                                                                                                                                                                                                                                                                                                                                                        <ul>

                                                                                                                                                                                                                                                                                                                                                                                                                                <li>Utilize pelo menos 16 caracteres.</li>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <li>Evite reutilizar senhas.</li>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <li>Prefira armazenar suas senhas em um gerenciador.</li>

                                                                                                                                                                                                                                                                                                                                                                                                        </ul>

                                                                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                        </body>

                                                                                                                                                                                                                                                                                                                                                                                        </html>
